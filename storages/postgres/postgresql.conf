# cache for shared memory, typically 25% of RAM
shared_buffers = 512MB

# for sort and hash table, may increase performance for large queries, typically 1-2% of RAM 
work_mem = 4MB
    
# for maintenance operations like VACUUM, CREATE INDEX, and ALTER TABLE, typically 1-2% of RAM
maintenance_work_mem = 64MB

# memory for caching query plans, typically 1-2% of RAM
effective_cache_size = 1536MB

# memory for WAL files, typically 1-2% of RAM
min_wal_size = 1GB
max_wal_size = 4GB

# for ssd, for hdd typically 2-4
random_page_cost = 1.1

max_connections = 50

# cpu parallelism, typically 2-4
max_worker_processes = 2
max_parallel_workers_per_gather = 1
max_parallel_workers = 2

# only for dev stage, logging for queries that take longer than 2 seconds
log_min_duration_statement = 2000