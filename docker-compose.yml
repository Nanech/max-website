networks:
  internal:
    driver: bridge
  public:
    external: true

volumes:
  pgdata:
  minio_data:
    driver: local

services:
  traefik:
    image: traefik:3.6
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.network=max-website_internal"
      - "--entrypoints.web.address=:80"
      - "--providers.docker.exposedbydefault=false"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.api.service=api@internal"
    networks:
      # - "traefik.http.routers.api.entrypoints=web"
      - internal
      - public

  postgres:
    image: postgres:16.9
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./storages/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    expose:
      - "5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: "http://${MINIO_PUBLIC_ENDPOINT}"
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - internal
      - public
    volumes:
      - minio_data:/data
    labels:
      - "traefik.enable=true"
      # Явно говорим Traefik, какую сеть использовать для связи с MinIO
      - "traefik.docker.network=max-website_internal"
      
      # Консоль
      - "traefik.http.routers.minio-console.rule=Host(`minio.localhost`)"
      - "traefik.http.routers.minio-console.entrypoints=web"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
      
      # S3 API / Раздача картинок
      - "traefik.http.routers.cdn.rule=Host(`${MINIO_PUBLIC_ENDPOINT}`)"
      - "traefik.http.routers.cdn.entrypoints=web"
      - "traefik.http.routers.cdn.service=cdn"
      - "traefik.http.services.cdn.loadbalancer.server.port=9000"
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend-aspnet:
    build:
      context: ./backend
      dockerfile: docker/dockerfile.dev
    container_name: backend-aspnet
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_HTTP_PORTS: ${ASPNETCORE_HTTP_PORTS}

      # PostgreSQL Connection
      ConnectionStrings__PhotosDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"

      # MinIO (без двойного подчеркивания - читаем напрямую)
      Minio__Container: ${MINIO_CONTAINER}
      Minio__Endpoint: ${MINIO_ENDPOINT}
      Minio__PublicEndpoint: "${MINIO_PUBLIC_ENDPOINT}"

      Minio__Port: ${MINIO_PORT}
      Minio__UseSsl: ${MINIO_USE_SSL}
      Minio__AccessKey: ${MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD}
      Minio__PhotosBucket: ${MINIO_PHOTOS_BUCKET}

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.localhost`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile.dev
    container_name: frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - backend-aspnet
    networks:
      - internal
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`) || Host(`max-website.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=5173"
