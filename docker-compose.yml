networks:
  internal: # Internal network for communication between services
    driver: bridge
  public: # Public network for external access
    external: true

volumes:
  pgdata:
  minio_data:
    driver: local

services:
  traefik:
    image: traefik:3.6
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.network=max-website_public" 
      - "--entrypoints.web.address=:80"
      - "--providers.docker.exposedbydefault=false"
      # - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.api.service=api@internal"
      # - "traefik.http.routers.api.entrypoints=web"
    networks:
      - internal
      - public

  postgres:
    image: postgres:16.9
    container_name: postgres
    restart: unless-stopped
    env_file:
      - ./storages/postgres/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./storages/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    expose:
      - "5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    container_name: minio
    restart: unless-stopped
    env_file:
      - ./storages/minio/.env
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - internal
      - public
    volumes:
      - minio_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`minio.localhost`)"
      - "traefik.http.routers.minio.entrypoints=web"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend-aspnet:
    build:
      context: ./backend
      dockerfile: docker/dockerfile.dev
    container_name: backend-aspnet
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.localhost`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    networks:
      - internal
      - public
